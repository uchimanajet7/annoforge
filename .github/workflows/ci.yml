name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webmcp-export:
    name: Web UI and WebMCP
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/image-loading.js
          node --check scripts/tools/web/receive-annotation-export.mjs

      - name: Test image loading and export receiver
        run: node --test tests/image-loading.test.mjs tests/webmcp-export.test.mjs

  shellcheck:
    name: ShellCheck (scripts/**/*.sh)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck (strict)
        run: bash scripts/tools/lint_shell.sh --strict

  terraform:
    name: Terraform fmt/validate (infra/terraform)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7

      - name: terraform fmt (auto-fix on push)
        if: github.event_name == 'push'
        run: |
          bash scripts/tools/fmt_terraform.sh --write
          if ! git diff --quiet; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: terraform fmt (auto-fix)"
            git push
          fi

      - name: terraform fmt -check -recursive (with diff)
        run: bash scripts/tools/fmt_terraform.sh --check

      - name: terraform init (no backend)
        run: bash scripts/tools/fmt_terraform.sh --validate
